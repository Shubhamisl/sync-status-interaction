<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Status Micro-interaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #fefefe;
      color: #111;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
    }

    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Outer Row holding Capsule and Retry Button */
    .interaction-stage {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      position: relative;
    }

    /* Pill-shaped Capsule */
    .capsule {
      position: relative;
      height: 72px;
      width: 213px; /* Default width in idle state */
      border-radius: 36px;
      background-color: #f4f4f4;
      border: 1.5px solid #ececec;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      display: flex;
      align-items: center;
      padding: 0 24px 0 20px;
      overflow: hidden;
      cursor: default;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.4s ease,
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
      will-change: width, transform;
    }

    .capsule.syncing {
      width: 184px;
      background-color: #f5f5f5;
      border-color: #e9e9e9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    /* Icon slot inside capsule */
    .icon-slot {
      position: relative;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Red Octagon Stop-Sign */
    .octagon-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .octagon-svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px rgba(252, 53, 41, 0.25));
    }

    .capsule.syncing .octagon-icon {
      opacity: 0;
      transform: scale(0.4) rotate(-45deg);
      pointer-events: none;
    }

    /* Dotted Spinner Icon */
    .spinner-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.4) rotate(45deg);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .capsule.syncing .spinner-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .spinner-svg {
      width: 24px;
      height: 24px;
      animation: spin-chase 1.05s steps(8, end) infinite;
    }

    @keyframes spin-chase {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Typography inside capsule */
    .text-slot {
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
      flex-grow: 1;
      overflow: hidden;
    }

    .status-text {
      position: absolute;
      left: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.025em;
      white-space: nowrap;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1),
                  filter 0.35s ease;
    }

    .text-failed {
      color: #fc3529;
      opacity: 1;
      transform: translateY(0);
      filter: blur(0px);
    }

    .capsule.syncing .text-failed {
      opacity: 0;
      transform: translateY(-16px) scale(0.92);
      filter: blur(4px);
      pointer-events: none;
    }

    .text-syncing {
      color: #0d0d0d;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      filter: blur(4px);
    }

    .capsule.syncing .text-syncing {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    /* Retry Button (Black Circle) */
    .button-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 14px;
      width: 72px;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  margin-left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.4s ease;
      will-change: width, margin-left;
    }

    .button-slot.hidden {
      width: 0;
      margin-left: 0;
      opacity: 0;
      pointer-events: none;
    }

    .retry-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: #000000;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.2s ease,
                  background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .retry-btn:hover {
      background-color: #1a1a1a;
      transform: scale(1.04);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
    }

    .retry-btn:active {
      transform: scale(0.90);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .button-slot.hidden .retry-btn {
      transform: scale(0.2) rotate(-90deg);
    }

    .retry-icon-svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s ease;
    }

    .retry-btn:hover .retry-icon-svg {
      transform: rotate(35deg);
    }

    /* Simulation Control Tray */
    .controls-tray {
      margin-top: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-size: 13px;
      color: #666;
    }

    .controls-tray button {
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .controls-tray button:hover {
      background: #e9e9e9;
      color: #000;
    }

    .badge-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fc3529;
      transition: background 0.3s ease;
    }

    .pulse-dot.active {
      background: #10b981;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <div class="interaction-stage" id="stage">
      
      <!-- Pill Capsule -->
      <div class="capsule" id="capsule">
        <div class="icon-slot">
          <!-- Red Octagon with Exclamation -->
          <div class="octagon-icon" id="octagonIcon">
            <svg class="octagon-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12.5 3.5H27.5L36.5 12.5V27.5L27.5 36.5H12.5L3.5 27.5V12.5L12.5 3.5Z" fill="#FC3529" stroke="#E62A1F" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M20 12V22" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
              <circle cx="20" cy="28.5" r="2" fill="#FFFFFF"/>
            </svg>
          </div>

          <!-- Dotted Chase Spinner -->
          <div class="spinner-icon" id="spinnerIcon">
            <svg class="spinner-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- 8 Dots with stepping opacities around circle -->
              <circle cx="16" cy="4" r="2.2" fill="#111111" fill-opacity="1.0"/>
              <circle cx="24.48" cy="7.51" r="2.2" fill="#111111" fill-opacity="0.87"/>
              <circle cx="28" cy="16" r="2.2" fill="#111111" fill-opacity="0.75"/>
              <circle cx="24.48" cy="24.48" r="2.2" fill="#111111" fill-opacity="0.62"/>
              <circle cx="16" cy="28" r="2.2" fill="#111111" fill-opacity="0.50"/>
              <circle cx="7.51" cy="24.48" r="2.2" fill="#111111" fill-opacity="0.37"/>
              <circle cx="4" cy="16" r="2.2" fill="#111111" fill-opacity="0.25"/>
              <circle cx="7.51" cy="7.51" r="2.2" fill="#111111" fill-opacity="0.12"/>
            </svg>
          </div>
        </div>

        <div class="text-slot">
          <span class="status-text text-failed" id="textFailed">Sync Failed</span>
          <span class="status-text text-syncing" id="textSyncing">Syncing</span>
        </div>
      </div>

      <!-- Circular Black Retry Button -->
      <div class="button-slot" id="buttonSlot">
        <button class="retry-btn" id="retryBtn" aria-label="Retry Sync">
          <svg class="retry-icon-svg" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.63-6.36L21 8"/>
            <polyline points="21 3 21 8 16 8"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Interactive control tray -->
    <div class="controls-tray">
      <div class="badge-info">
        <span class="pulse-dot" id="stateDot"></span>
        <span id="stateLabel">State: Sync Failed</span>
      </div>
      <button id="triggerBtn">Simulate Click</button>
      <button id="autoLoopBtn">Toggle Auto Loop</button>
    </div>
  </div>

  <script>
    // Domain Model: Finite State Machine
    const STATES = {
      FAILED: 'FAILED',
      SYNCING: 'SYNCING'
    };

    let currentState = STATES.FAILED;
    let autoLoop = false;
    let autoLoopTimer = null;

    // DOM Elements
    const capsule = document.getElementById('capsule');
    const buttonSlot = document.getElementById('buttonSlot');
    const retryBtn = document.getElementById('retryBtn');
    const stateDot = document.getElementById('stateDot');
    const stateLabel = document.getElementById('stateLabel');
    const triggerBtn = document.getElementById('triggerBtn');
    const autoLoopBtn = document.getElementById('autoLoopBtn');

    function setState(nextState) {
      if (currentState === nextState) return;
      currentState = nextState;

      if (currentState === STATES.SYNCING) {
        // Morph capsule to Syncing state
        capsule.classList.add('syncing');
        buttonSlot.classList.add('hidden');
        stateDot.classList.add('active');
        stateLabel.textContent = 'State: Syncing...';

        // Revert back to FAILED after holding for 3.2s
        setTimeout(() => {
          if (currentState === STATES.SYNCING) {
            setState(STATES.FAILED);
          }
        }, 3200);

      } else {
        // Morph capsule back to Failed state with elastic bounce
        capsule.classList.remove('syncing');
        buttonSlot.classList.remove('hidden');
        stateDot.classList.remove('active');
        stateLabel.textContent = 'State: Sync Failed';

        if (autoLoop) {
          clearTimeout(autoLoopTimer);
          autoLoopTimer = setTimeout(() => {
            if (autoLoop && currentState === STATES.FAILED) {
              triggerRetry();
            }
          }, 2400);
        }
      }
    }

    function triggerRetry() {
      if (currentState === STATES.SYNCING) return;
      // Spring press animation
      retryBtn.style.transform = 'scale(0.88)';
      setTimeout(() => {
        retryBtn.style.transform = '';
        setState(STATES.SYNCING);
      }, 150);
    }

    retryBtn.addEventListener('click', triggerRetry);
    triggerBtn.addEventListener('click', triggerRetry);

    autoLoopBtn.addEventListener('click', () => {
      autoLoop = !autoLoop;
      autoLoopBtn.textContent = autoLoop ? 'Auto Loop: ON' : 'Toggle Auto Loop';
      autoLoopBtn.style.backgroundColor = autoLoop ? '#000' : '';
      autoLoopBtn.style.color = autoLoop ? '#fff' : '';
      if (autoLoop && currentState === STATES.FAILED) {
        triggerRetry();
      }
    });
  </script>
</body>
</html>
