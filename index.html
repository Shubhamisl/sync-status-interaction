<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextual Feedback Interaction — Nitish Khagwal (@nitishkmrk)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-color: #fefefe;
      --failed-red: #fd332d;
      --capsule-bg: #f4f4f4;
      --text-dark: #000000;
      --btn-black: #000000;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Plus Jakarta Sans", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #000000;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
    }

    /* Outer Presentation Stage */
    .viewport-canvas {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container for the interacting group */
    .interaction-stage {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;

      /* Medium scale default: 120px height */
      --base-h: 120px;
      --cap-h: 120px;
      --cap-radius: 60px;
      --cap-failed-w: 371px;
      --cap-syncing-w: 307px;
      --btn-size: 120px;
      --gap: 20px;
      --font-size: 42px;
      --letter-spacing: -0.03em;
      --icon-slot-w: 46px;
      --icon-slot-h: 44px;
      --spinner-size: 38px;
      --pad-left: 37px;
      --pad-right-failed: 52px;
      --pad-right-syncing: 51px;
      --icon-margin-failed: 23px;
      --icon-margin-syncing: 32px;

      height: var(--cap-h);
      transition: all 0.3s ease;
    }

    /* Scaled modes */
    .interaction-stage.scale-compact {
      --base-h: 64px;
      --cap-h: 64px;
      --cap-radius: 32px;
      --cap-failed-w: 198px;
      --cap-syncing-w: 164px;
      --btn-size: 64px;
      --gap: 11px;
      --font-size: 22px;
      --letter-spacing: -0.03em;
      --icon-slot-w: 24px;
      --icon-slot-h: 24px;
      --spinner-size: 20px;
      --pad-left: 20px;
      --pad-right-failed: 28px;
      --pad-right-syncing: 27px;
      --icon-margin-failed: 12px;
      --icon-margin-syncing: 17px;
    }

    .interaction-stage.scale-original {
      /* 1:1 pixel match with 960x960 reference frames */
      --base-h: 144px;
      --cap-h: 144px;
      --cap-radius: 72px;
      --cap-failed-w: 445px;
      --cap-syncing-w: 368px;
      --btn-size: 144px;
      --gap: 24px;
      --font-size: 50px;
      --letter-spacing: -0.03em;
      --icon-slot-w: 55px;
      --icon-slot-h: 53px;
      --spinner-size: 45px;
      --pad-left: 44px;
      --pad-right-failed: 62px;
      --pad-right-syncing: 61px;
      --icon-margin-failed: 28px;
      --icon-margin-syncing: 38px;
    }

    /* Pill-shaped Capsule */
    .capsule {
      position: relative;
      height: var(--cap-h);
      width: var(--cap-failed-w);
      border-radius: var(--cap-radius);
      background-color: var(--capsule-bg);
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      padding-left: var(--pad-left);
      padding-right: var(--pad-right-failed);
      overflow: hidden;
      cursor: default;
      transition: width 0.48s cubic-bezier(0.34, 1.56, 0.64, 1),
                  padding-right 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: width;
    }

    /* Syncing State of Capsule */
    .capsule.syncing {
      width: var(--cap-syncing-w);
      padding-right: var(--pad-right-syncing);
    }

    /* Icon Slot inside capsule */
    .icon-slot {
      position: relative;
      width: var(--icon-slot-w);
      height: var(--icon-slot-h);
      flex-shrink: 0;
      margin-right: var(--icon-margin-failed);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: margin-right 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .capsule.syncing .icon-slot {
      margin-right: var(--icon-margin-syncing);
    }

    /* Octagon Stop Sign */
    .octagon-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .octagon-svg {
      width: 100%;
      height: 100%;
    }

    .capsule.syncing .octagon-icon {
      opacity: 0;
      transform: scale(0.3) rotate(-45deg);
      pointer-events: none;
    }

    /* 8-Dot Chase Spinner */
    .spinner-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.3) rotate(45deg);
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .capsule.syncing .spinner-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .spinner-svg {
      width: var(--spinner-size);
      height: var(--spinner-size);
      animation: spin-chase 0.9s steps(8, end) infinite;
    }

    @keyframes spin-chase {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Text Container */
    .text-slot {
      position: relative;
      height: calc(var(--cap-h) * 0.35);
      display: flex;
      align-items: center;
      flex-grow: 1;
      overflow: hidden;
    }

    .status-text {
      position: absolute;
      left: 0;
      font-size: var(--font-size);
      font-weight: 700;
      letter-spacing: var(--letter-spacing);
      line-height: 1;
      white-space: nowrap;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.44s cubic-bezier(0.34, 1.4, 0.64, 1),
                  filter 0.28s ease;
    }

    .text-failed {
      color: var(--failed-red);
      opacity: 1;
      transform: translateY(0);
      filter: blur(0px);
    }

    .capsule.syncing .text-failed {
      opacity: 0;
      transform: translateY(-20px) scale(0.92);
      filter: blur(4px);
      pointer-events: none;
    }

    .text-syncing {
      color: var(--text-dark);
      opacity: 0;
      transform: translateY(20px) scale(0.92);
      filter: blur(4px);
    }

    .capsule.syncing .text-syncing {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    /* Circular Retry Button */
    .button-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: var(--gap);
      width: var(--btn-size);
      height: var(--btn-size);
      transition: width 0.48s cubic-bezier(0.34, 1.56, 0.64, 1),
                  margin-left 0.48s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.32s ease;
      will-change: width, margin-left;
    }

    .button-slot.hidden {
      width: 0;
      margin-left: 0;
      opacity: 0;
      pointer-events: none;
    }

    .retry-btn {
      width: var(--btn-size);
      height: var(--btn-size);
      border-radius: var(--cap-radius);
      background-color: var(--btn-black);
      border: none;
      outline: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .retry-btn:hover {
      transform: scale(1.02);
    }

    .retry-btn:active, .retry-btn.pressed {
      transform: scale(0.91);
    }

    .button-slot.hidden .retry-btn {
      transform: scale(0.15) rotate(-90deg);
    }

    .retry-icon-svg {
      width: calc(var(--btn-size) * (54 / 144));
      height: calc(var(--btn-size) * (54 / 144));
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      transition: transform 0.3s ease;
    }

    .retry-btn:hover .retry-icon-svg {
      transform: rotate(35deg);
    }

    /* Realistic Animated Cursor (macOS pointer overlay) */
    .simulated-cursor {
      position: absolute;
      width: 28px;
      height: 38px;
      pointer-events: none;
      z-index: 100;
      transform: translate(620px, 480px);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25));
    }

    .simulated-cursor.visible {
      opacity: 1;
    }

    /* Control Tray */
    .controls-panel {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #e7e7e7;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      font-size: 13px;
      color: #555;
    }

    .controls-panel button {
      background: #f4f4f4;
      border: 1px solid #dfdfdf;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .controls-panel button:hover {
      background: #eaeaea;
      color: #000;
    }

    .controls-panel button.active {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .badge-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      margin-right: 8px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--failed-red);
      transition: background 0.3s ease;
    }

    .pulse-dot.active {
      background: #10b981;
    }

    .meta-credits {
      margin-top: 18px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .meta-credits a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>

  <div class="viewport-canvas">
    <div class="interaction-stage" id="stage">
      
      <!-- Pill-shaped Capsule -->
      <div class="capsule" id="capsule">
        <div class="icon-slot">
          <!-- Red Octagon Stop-Sign with Exclamation Mark -->
          <div class="octagon-icon" id="octagonIcon">
            <svg class="octagon-svg" viewBox="0 0 55 53" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 2H39L53 16V37L39 51H16L2 37V16L16 2Z" fill="#FD332D" stroke="#E62822" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M27.5 14V29" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
              <circle cx="27.5" cy="36.5" r="2.6" fill="#FFFFFF"/>
            </svg>
          </div>

          <!-- Dotted Chase Spinner (8 dots stepping in opacity) -->
          <div class="spinner-icon" id="spinnerIcon">
            <svg class="spinner-svg" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="22.5" cy="6.5" r="3.3" fill="#000000" fill-opacity="1.00"/>
              <circle cx="33.8" cy="11.2" r="3.3" fill="#000000" fill-opacity="0.87"/>
              <circle cx="38.5" cy="22.5" r="3.3" fill="#000000" fill-opacity="0.75"/>
              <circle cx="33.8" cy="33.8" r="3.3" fill="#000000" fill-opacity="0.62"/>
              <circle cx="22.5" cy="38.5" r="3.3" fill="#000000" fill-opacity="0.50"/>
              <circle cx="11.2" cy="33.8" r="3.3" fill="#000000" fill-opacity="0.37"/>
              <circle cx="6.5" cy="22.5" r="3.3" fill="#000000" fill-opacity="0.25"/>
              <circle cx="11.2" cy="11.2" r="3.3" fill="#000000" fill-opacity="0.12"/>
            </svg>
          </div>
        </div>

        <div class="text-slot">
          <span class="status-text text-failed" id="textFailed">Sync Failed</span>
          <span class="status-text text-syncing" id="textSyncing">Syncing</span>
        </div>
      </div>

      <!-- Circular Black Retry Button -->
      <div class="button-slot" id="buttonSlot">
        <button class="retry-btn" id="retryBtn" aria-label="Retry Sync">
          <!-- White clockwise arrow icon -->
          <svg class="retry-icon-svg" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.63-6.36L21 8"/>
            <polyline points="21 3 21 8 16 8"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- macOS Pointer SVG for realistic simulation -->
    <svg class="simulated-cursor" id="simCursor" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1L9.5 24L13.5 16L21.5 14L1 1Z" fill="#1C1C1E" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Interactive Controls Panel -->
  <div class="controls-panel">
    <div class="badge-info">
      <span class="pulse-dot" id="stateDot"></span>
      <span id="stateLabel">State: Sync Failed</span>
    </div>

    <button id="triggerBtn">Click Retry</button>
    <button id="replayDemoBtn">Replay Video Demo</button>
    <button id="scaleBtn">Scale: Medium (120px)</button>
    <button id="autoLoopBtn">Auto Loop: OFF</button>
  </div>

  <div class="meta-credits">
    Based on contextual feedback interaction by <a href="https://x.com/nitishkmrk/status/2083103451719025094" target="_blank" rel="noopener">Nitish Khagwal (@nitishkmrk)</a>.
  </div>

  <script>
    // Finite state machine
    const STATES = {
      FAILED: 'FAILED',
      SYNCING: 'SYNCING'
    };

    let currentState = STATES.FAILED;
    let autoLoop = false;
    let autoLoopTimer = null;
    let currentScale = 'medium'; // 'compact' (64px), 'medium' (120px), 'original' (144px)

    const stage = document.getElementById('stage');
    const capsule = document.getElementById('capsule');
    const buttonSlot = document.getElementById('buttonSlot');
    const retryBtn = document.getElementById('retryBtn');
    const stateDot = document.getElementById('stateDot');
    const stateLabel = document.getElementById('stateLabel');
    const triggerBtn = document.getElementById('triggerBtn');
    const replayDemoBtn = document.getElementById('replayDemoBtn');
    const scaleBtn = document.getElementById('scaleBtn');
    const autoLoopBtn = document.getElementById('autoLoopBtn');
    const simCursor = document.getElementById('simCursor');

    function setState(nextState) {
      if (currentState === nextState) return;
      currentState = nextState;

      if (currentState === STATES.SYNCING) {
        capsule.classList.add('syncing');
        buttonSlot.classList.add('hidden');
        stateDot.classList.add('active');
        stateLabel.textContent = 'State: Syncing...';

        // Revert back to FAILED after holding for 2.6s (exact timing in video)
        setTimeout(() => {
          if (currentState === STATES.SYNCING) {
            setState(STATES.FAILED);
          }
        }, 2600);

      } else {
        capsule.classList.remove('syncing');
        buttonSlot.classList.remove('hidden');
        stateDot.classList.remove('active');
        stateLabel.textContent = 'State: Sync Failed';

        if (autoLoop) {
          clearTimeout(autoLoopTimer);
          autoLoopTimer = setTimeout(() => {
            if (autoLoop && currentState === STATES.FAILED) {
              triggerRetry();
            }
          }, 2400);
        }
      }
    }

    function triggerRetry() {
      if (currentState === STATES.SYNCING) return;
      retryBtn.classList.add('pressed');
      setTimeout(() => {
        retryBtn.classList.remove('pressed');
        setState(STATES.SYNCING);
      }, 140);
    }

    retryBtn.addEventListener('click', triggerRetry);
    triggerBtn.addEventListener('click', triggerRetry);

    // Auto loop toggle
    autoLoopBtn.addEventListener('click', () => {
      autoLoop = !autoLoop;
      autoLoopBtn.textContent = autoLoop ? 'Auto Loop: ON' : 'Auto Loop: OFF';
      autoLoopBtn.classList.toggle('active', autoLoop);
      if (autoLoop && currentState === STATES.FAILED) {
        triggerRetry();
      }
    });

    // Scale switcher: Compact (64px) -> Medium (120px) -> Original (144px)
    scaleBtn.addEventListener('click', () => {
      stage.classList.remove('scale-compact', 'scale-original');
      if (currentScale === 'medium') {
        currentScale = 'original';
        stage.classList.add('scale-original');
        scaleBtn.textContent = 'Scale: Original (144px)';
      } else if (currentScale === 'original') {
        currentScale = 'compact';
        stage.classList.add('scale-compact');
        scaleBtn.textContent = 'Scale: Compact (64px)';
      } else {
        currentScale = 'medium';
        scaleBtn.textContent = 'Scale: Medium (120px)';
      }
    });

    // Replay full video demo choreography with simulated cursor
    replayDemoBtn.addEventListener('click', () => {
      if (currentState === STATES.SYNCING) {
        setState(STATES.FAILED);
      }

      // Position cursor at bottom right
      const rect = retryBtn.getBoundingClientRect();
      const canvasRect = document.querySelector('.viewport-canvas').getBoundingClientRect();
      
      const targetX = rect.left - canvasRect.left + rect.width / 2;
      const targetY = rect.top - canvasRect.top + rect.height / 2;

      simCursor.style.transform = `translate(${targetX + 140}px, ${targetY + 180}px)`;
      simCursor.classList.add('visible');

      // Move cursor to button
      setTimeout(() => {
        simCursor.style.transform = `translate(${targetX}px, ${targetY}px)`;
      }, 200);

      // Click button
      setTimeout(() => {
        triggerRetry();
      }, 750);

      // Cursor moves away
      setTimeout(() => {
        simCursor.style.transform = `translate(${targetX + 120}px, ${targetY + 160}px)`;
      }, 1050);

      // Hide cursor
      setTimeout(() => {
        simCursor.classList.remove('visible');
      }, 1700);
    });
  </script>
</body>
</html>
